name: basketball_manager
description: Deterministic, offline-first basketball management game.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  simulation_core:
    path: packages/simulation_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: frozen T021 criterion 2 requires a SHA-256 ledger digest.
  # Same already-approved package the simulation core uses for fingerprinting.
  crypto: ^3.0.7

flutter:
  uses-material-design: true
